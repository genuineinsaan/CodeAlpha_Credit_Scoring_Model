<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Credit Scoring & Bank Eligibility System</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="container">

        <div class="header">
            <h1>Credit Scoring & Bank Eligibility System</h1>
            <p>AI-Powered Loan Eligibility Assessment & Credit Risk Analysis Platform</p>
        </div>

        <form action="/predict" method="POST">

            <div class="section">
                <h2>Personal Information</h2>

                <div class="form-grid">

                    <div>
                        <label>Age</label>
                        <input type="number" name="age" required>
                    </div>

                    <div>
                        <label>Gender</label>
                        <select name="sex" required>
                            <option value="">Select Gender</option>
                            <option value="male">Male</option>
                            <option value="female">Female</option>
                        </select>
                    </div>

                    <div>
                        <label>Job Category</label>
                        <select name="job" required>
                            <option value="">Select Job Category</option>
                            <option value="0">Unskilled Non-Resident</option>
                            <option value="1">Unskilled Resident</option>
                            <option value="2">Skilled Employee</option>
                            <option value="3">Highly Skilled / Management</option>
                        </select>
                    </div>

                    <div>
                        <label>Housing Type</label>
                        <select name="housing" required>
                            <option value="">Select Housing Type</option>
                            <option value="own">Own</option>
                            <option value="rent">Rent</option>
                            <option value="free">Free</option>
                        </select>
                    </div>

                </div>
            </div>

            <div class="section">
                <h2>Financial Information</h2>

                <div class="form-grid">

                    <div>
                        <label>Saving Account Status</label>
                        <select name="saving_accounts" required>
                            <option value="">Select Status</option>
                            <option value="little">Little</option>
                            <option value="moderate">Moderate</option>
                            <option value="quite rich">Quite Rich</option>
                            <option value="rich">Rich</option>
                            <option value="unknown">Unknown</option>
                        </select>
                    </div>

                    <div>
                        <label>Checking Account Status</label>
                        <select name="checking_account" required>
                            <option value="">Select Status</option>
                            <option value="little">Little</option>
                            <option value="moderate">Moderate</option>
                            <option value="rich">Rich</option>
                            <option value="unknown">Unknown</option>
                        </select>
                    </div>

                </div>
            </div>

            <div class="section">
                <h2>Loan Information</h2>

                <div class="form-grid">

                    <div>
                        <label>Credit Amount</label>
                        <input type="number" name="credit_amount" required>
                    </div>

                    <div>
                        <label>Loan Duration (Months)</label>
                        <input type="number" name="duration" required>
                    </div>

                    <div style="grid-column: span 2;">
                        <label>Loan Purpose</label>
                        <select name="purpose" required>
                            <option value="">Select Purpose</option>
                            <option value="car">Car</option>
                            <option value="radio/TV">Radio/TV</option>
                            <option value="education">Education</option>
                            <option value="furniture/equipment">Furniture/Equipment</option>
                            <option value="business">Business</option>
                            <option value="domestic appliances">Domestic Appliances</option>
                            <option value="repairs">Repairs</option>
                            <option value="vacation/others">Vacation/Others</option>
                        </select>
                    </div>

                </div>
            </div>

            <button type="submit">
                Analyze Application
            </button>

        </form>

    </div>

<footer class="footer">
    <p>
        Credit Scoring & Bank Eligibility System |
        Developed using Python, Flask, Machine Learning and Random Forest
    </p>
</footer>

</body>

</html>
